info:
  title: Gestão Fretamento Pro API
  description: API REST para gestão de fretamento empresarial
  version: 1.0.0
  contact: {}
tags:
  - name: auth
    description: Autenticação e autorização
  - name: tenants
    description: Gestão de empresas e filiais
  - name: users
    description: Gestão de usuários
  - name: roles
    description: Gestão de cargos e permissões
  - name: vehicles
    description: Gestão de frota
  - name: drivers
    description: Gestão de motoristas
  - name: trips
    description: Gestão de viagens
  - name: clients
    description: Gestão de clientes
  - name: occurrences
    description: Gestão de ocorrências
  - name: fuel
    description: Controle de abastecimento
  - name: maintenance
    description: Gestão de manutenção
  - name: documents
    description: Gestão de documentos
  - name: notifications
    description: Notificações
  - name: analytics
    description: Dashboards e analytics
  - name: audit
    description: Logs de auditoria
  - name: health
    description: Health checks
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    TokenUserDto:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        email:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
        - id
        - tenantId
        - name
        - email
        - permissions
    TokenPairDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          format: date-time
          type: string
        refreshTokenExpiresAt:
          format: date-time
          type: string
        user:
          $ref: '#/components/schemas/TokenUserDto'
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
        - refreshTokenExpiresAt
        - user
    UserWithPermissionsDto:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        employeeId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
        lastLoginAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        roleId:
          type: string
        roleName:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
        - id
        - tenantId
        - name
        - email
        - status
        - createdAt
        - updatedAt
        - permissions
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        employeeId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
        lastLoginAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - tenantId
        - name
        - email
        - status
        - createdAt
        - updatedAt
