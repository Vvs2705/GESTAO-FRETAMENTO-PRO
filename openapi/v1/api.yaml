openapi: 3.0.0
paths:
  /v1/health:
    get:
      operationId: HealthController_live
      summary: Liveness probe — confirms the process is alive
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - health
  /v1/health/ready:
    get:
      operationId: HealthController_ready
      summary: Readiness probe — verifies database and Redis connectivity
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - health
  /v1/auth/login:
    post:
      operationId: AuthController_login
      summary: Autenticar usuário e obter tokens de acesso
      parameters: []
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDto'
        '401':
          description: Credenciais inválidas
        '429':
          description: Muitas tentativas — tente mais tarde
      tags:
        - auth
  /v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      summary: Renovar tokens usando refresh token
      parameters: []
      responses:
        '200':
          description: Tokens renovados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDto'
        '401':
          description: Refresh token inválido ou expirado
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: AuthController_logout
      summary: Encerrar sessão do usuário
      parameters: []
      responses:
        '204':
          description: Logout realizado com sucesso
        '401':
          description: Não autenticado
      tags:
        - auth
      security:
        - bearer: []
  /v1/tenants/current:
    get:
      operationId: TenantsController_getCurrent
      summary: Obter dados da empresa atual
      parameters: []
      responses:
        '200':
          description: Dados da empresa
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
      tags:
        - tenants
      security:
        - bearer: []
    patch:
      operationId: TenantsController_update
      summary: Atualizar dados da empresa atual
      parameters: []
      responses:
        '200':
          description: Empresa atualizada com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
      tags:
        - tenants
      security:
        - bearer: []
  /v1/tenants/branches:
    get:
      operationId: TenantsController_getBranches
      summary: Listar filiais da empresa
      parameters: []
      responses:
        '200':
          description: Lista de filiais
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
      tags:
        - tenants
      security:
        - bearer: []
    post:
      operationId: TenantsController_createBranch
      summary: Criar nova filial
      parameters: []
      responses:
        '201':
          description: Filial criada com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
      tags:
        - tenants
      security:
        - bearer: []
  /v1/tenants/branches/{id}:
    patch:
      operationId: TenantsController_updateBranch
      summary: Atualizar filial
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Filial atualizada com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '404':
          description: Filial não encontrada
      tags:
        - tenants
      security:
        - bearer: []
  /v1/users/me:
    get:
      operationId: UsersController_getMe
      summary: Obter dados do usuário autenticado
