            application/json:
              schema:
                $ref: '#/components/schemas/UserWithPermissionsDto'
        '401':
          description: Não autenticado
      tags:
        - users
      security:
        - bearer: []
  /v1/users:
    get:
      operationId: UsersController_findAll
      summary: Listar usuários da empresa
      parameters:
        - name: search
          required: false
          in: query
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Lista de usuários paginada
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
      tags:
        - users
      security:
        - bearer: []
    post:
      operationId: UsersController_create
      summary: Criar novo usuário
      parameters: []
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Dados inválidos
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
        '409':
          description: E-mail já cadastrado
      tags:
        - users
      security:
        - bearer: []
  /v1/users/{id}:
    get:
      operationId: UsersController_findById
      summary: Obter usuário por ID
      parameters:
