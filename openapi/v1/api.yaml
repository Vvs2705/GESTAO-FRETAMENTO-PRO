        - users
      security:
        - bearer: []
    patch:
      operationId: UsersController_update
      summary: Atualizar dados do usuário
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Usuário atualizado com sucesso
          content:
            application/json:
